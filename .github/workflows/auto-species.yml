name: Propose a new species

# Weekly, or on demand with scientific names, a request in words and/or a count. A run opens one pull request for all the species it
# added; nothing reaches main without review.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      name:
        description: 学名，例如 Panthera tigris；可填多个，用逗号或换行分隔（留空则自动挑选）
        required: false
        default: ''
      ask:
        description: 用一句话说明要挑的物种，例如“眼镜蛇科的20个物种”“猫科中分布在中国的”；模型从 GBIF 中图鉴尚未收录的物种里挑选
        required: false
        default: ''
      count:
        description: 另外自动挑选几个物种（留空：没填学名时为 1，填了学名时为 0）；填了要求时表示按要求挑几个，覆盖要求里的数量
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-species
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    # Up to three writing calls per species, plus two mandatory source-check calls.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open species pull request
        run: node scripts/auto-species.mjs --pr
        env:
          # Passed through the environment rather than the command line, so the input is never parsed by the shell.
          SPECIES_NAME: ${{ inputs.name }}
          SPECIES_ASK: ${{ inputs.ask }}
          SPECIES_COUNT: ${{ inputs.count }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_JSON_MODE: ${{ vars.LLM_JSON_MODE }}
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_REVIEW_MODEL: ${{ vars.LLM_REVIEW_MODEL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GH_TOKEN: ${{ github.token }}
