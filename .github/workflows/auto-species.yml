name: Propose a new species

# Weekly, or on demand with a scientific name. The result is a pull request; nothing reaches main without review.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      name:
        description: 学名，例如 Panthera tigris（留空则自动挑选）
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-species
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    # Up to three model calls, each limited by LLM_TIMEOUT (300 s by default).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open species pull request
        run: node scripts/auto-species.mjs --pr
        env:
          # Passed through the environment rather than the command line, so the input is never parsed by the shell.
          SPECIES_NAME: ${{ inputs.name }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_JSON_MODE: ${{ vars.LLM_JSON_MODE }}
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}
          GH_TOKEN: ${{ github.token }}
